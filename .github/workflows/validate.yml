name: Validate AeroLens Intelligence
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild observed and synthetic data
        run: |
          python scripts/build_data.py
          python scripts/build_advanced.py
          python scripts/build_enterprise.py
      - name: Generate and validate Power BI project metadata
        run: |
          python scripts/build_powerbi.py
          python scripts/validate_powerbi.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
